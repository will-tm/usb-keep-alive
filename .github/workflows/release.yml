name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust targets
        run: rustup target add thumbv6m-none-eabi thumbv8m.main-none-eabihf

      - uses: Swatinem/rust-cache@v2

      - name: Install elf2uf2-rs
        run: cargo install elf2uf2-rs --locked --version 2.2.0 --target x86_64-unknown-linux-gnu

      - name: Build UF2s
        run: |
          ./tools/mkuf2.sh rp2040 dist/usb-keep-alive-rp2040.uf2
          ./tools/mkuf2.sh rp2350 dist/usb-keep-alive-rp2350.uf2

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/usb-keep-alive-rp2040.uf2 \
            dist/usb-keep-alive-rp2350.uf2

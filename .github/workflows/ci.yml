name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.chip }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: rp2040
            target: thumbv6m-none-eabi
          - chip: rp2350
            target: thumbv8m.main-none-eabihf
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.chip }}

      - name: Install libudev
        # elf2uf2-rs links libudev for its --deploy support
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Install elf2uf2-rs
        # --target is required: .cargo/config.toml defaults builds to a bare-metal
        # target, which would otherwise be used for this host tool too.
        run: cargo install elf2uf2-rs --locked --version 2.2.0 --target x86_64-unknown-linux-gnu

      - name: Build UF2
        run: ./tools/mkuf2.sh ${{ matrix.chip }} dist/usb-keep-alive-${{ matrix.chip }}.uf2

      - uses: actions/upload-artifact@v4
        with:
          name: usb-keep-alive-${{ matrix.chip }}
          path: dist/usb-keep-alive-${{ matrix.chip }}.uf2
          if-no-files-found: error
